    chart_repo: https://argoproj.github.io/argo-helm
    chart_name: argo-rollouts
    chart_version: "2.41.0"
    app_version: "v1.9.0"
    namespace: argo-rollouts
    phase: 4
    notes: "Replica-weighted canary. No traffic-router plugin."

  - name: keda
    display_name: "KEDA"
    plane: foundation
    project_url: https://keda.sh
    install_method: helm
    chart_repo: https://kedacore.github.io/charts
    chart_name: keda
    chart_version: "2.20.1"
    app_version: "2.20.1"
    namespace: keda
    phase: 4
    notes: "Prometheus trigger. Kind has no metrics-server, so CPU triggers do not work."

  # --- Foundation: portal ---
  - name: backstage
    display_name: "Backstage"
    plane: foundation
    project_url: https://backstage.io
    install_method: helm
    chart_repo: https://backstage.github.io/charts
    chart_name: backstage
    chart_version: "2.8.2"
    app_version: "1.51.2"
    namespace: backstage
    phase: 5
    notes: "Custom image built by images/backstage/build-and-push.sh into localhost:5001."

  - name: backstage-postgres
    display_name: "PostgreSQL for Backstage"
    plane: foundation
    project_url: https://www.postgresql.org
    install_method: kubectl
    chart_repo: null
    chart_name: null
    chart_version: null
