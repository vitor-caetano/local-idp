# A replica-weighted canary: half the pods move to the new version, a pause, then the rest. No
# traffic router. KEDA owns the replica count, so spec.replicas is left out.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: ${{ values.name }}
  labels:
    app: ${{ values.name }}
spec:
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: ${{ values.name }}
  strategy:
    canary:
      steps:
        - setWeight: 50
        - pause:
            duration: 30s
  template:
    metadata:
      labels:
        app: ${{ values.name }}
        version: v1
    spec:
      securityContext:
        runAsNonRoot: true
        # The USER in the service's Dockerfile.
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: service
          image: service
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
