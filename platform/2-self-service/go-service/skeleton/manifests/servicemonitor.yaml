# Prometheus selects every ServiceMonitor, and labels each series with the Service name, which is
# what the ScaledObject's query and the phase 6 test filter on.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ${{ values.name }}
spec:
  selector:
    matchLabels:
      app: ${{ values.name }}
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
