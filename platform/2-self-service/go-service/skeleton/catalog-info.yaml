apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ${{ values.name }}
  description: ${{ values.description }}
  annotations:
    backstage.io/kubernetes-id: ${{ values.name }}
    # The Kubernetes plugin looks resources up by label. Without this it searches for
    # backstage.io/kubernetes-id, which the manifests do not carry; they label everything app.
    backstage.io/kubernetes-label-selector: app=${{ values.name }}
    backstage.io/kubernetes-namespace: apps
    argocd/app-name: svc-${{ values.name }}
  links:
    - url: https://${{ values.name }}.localtest.me/
      title: Service
spec:
  type: service
  lifecycle: experimental
  owner: ${{ values.owner }}
