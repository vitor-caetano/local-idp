# ABOUTME: Backstage golden-path template. Scaffolds a Go HTTP service into the Gitea services org,
# ABOUTME: which CI builds and the golden-path ApplicationSet deploys to https://<name>.localtest.me.
#
# Backstage reads this file from ${PLATFORM_RAW_BASE}/platform/2-self-service/go-service/template.yaml
# (see images/backstage/app-config.production.yaml). The skeleton sits next to it and is fetched
# relative to it.
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: go-service
  title: Go service
  description: >-
    A Go HTTP service with health and metrics endpoints, built by the platform CI pipeline and
    deployed as a canary Rollout, scaled by KEDA, and scraped by Prometheus.
  tags:
    - go
    - recommended
spec:
  owner: group:default/platform-team
  type: service
  parameters:
    - title: Service
      required:
        - name
      properties:
        name:
          title: Name
          type: string
          description: >-
            Lowercase, digits and hyphens. Becomes the repo name, the Kubernetes names, and the
            hostname <name>.localtest.me.
          pattern: "^[a-z][a-z0-9-]{1,30}[a-z0-9]$"
          ui:autofocus: true
        description:
          title: Description
          type: string
          description: One line on what this service does.
          default: A Go HTTP service from the golden path.
        owner:
          title: Owner
          type: string
          description: The owning group.
          default: group:default/platform-team
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: [Group]
  steps:
    - id: fetch
      name: Render the skeleton
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}

    # Public, so the ApplicationSet and the CI clone read it anonymously. Needs
    # @backstage/plugin-scaffolder-backend-module-gitea and an integrations.gitea entry.
    - id: publish
      name: Publish to Gitea
      action: publish:gitea
      input:
        repoUrl: gitea-http.gitea.svc:3000?owner=services&repo=${{ parameters.name }}
        # publish:gitea requires a description, and a cleared form field arrives as nothing.
        description: ${{ parameters.description or "A Go HTTP service from the golden path." }}
        repoVisibility: public
        defaultBranch: main

    - id: register
      name: Register in the catalog
      action: catalog:register
      input:
        # Built explicitly: publish:gitea's repoContentsUrl output drops the branch
        # (.../src/branch/catalog-info.yaml), and the catalog rejects that URL with 400.
        catalogInfoUrl: http://gitea-http.gitea.svc:3000/services/${{ parameters.name }}/src/branch/main/catalog-info.yaml

  output:
    links:
      - title: Repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
      - title: Service (live after the first CI run)
        url: https://${{ parameters.name }}.localtest.me
