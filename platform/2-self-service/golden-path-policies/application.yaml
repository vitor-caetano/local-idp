# ABOUTME: The three golden-path policies, scoped to apps. They ship Audit; phase 7 flips them to Enforce
# ABOUTME: with one commit. The foundation baseline is a separate set and stays Audit.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: golden-path-policies
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: http://gitea-http.gitea.svc:3000/platform/local-idp.git
    targetRevision: main
    path: platform/2-self-service/golden-path-policies/manifests
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
