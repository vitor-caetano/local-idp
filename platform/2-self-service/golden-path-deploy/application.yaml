# ABOUTME: Deploys every golden-path service: the AppProject that bounds what a generated service may
# ABOUTME: create, and the ApplicationSet that finds service repos in Gitea.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: golden-path-deploy
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: http://gitea-http.gitea.svc:3000/platform/local-idp.git
    targetRevision: main
    path: platform/2-self-service/golden-path-deploy/manifests
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
