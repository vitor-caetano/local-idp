# ABOUTME: Values for the argo-cd chart, installed once by provision/bootstrap-argocd.sh. Carries the
# ABOUTME: health checks for every custom resource the platform waits on, so they apply from day one.
global:
  domain: argocd.localtest.me

configs:
  params:
    # TLS terminates at the platform Gateway; ArgoCD serves plain HTTP behind it.
    server.insecure: true

  # Envoy Gateway's chart lives in an OCI registry. ArgoCD needs the repository declared with
  # enableOCI before a Helm source can pull from it.
  repositories:
    envoyproxy-oci:
      name: envoyproxy
      type: helm
      url: docker.io/envoyproxy
      enableOCI: "true"

  cm:
    # Read-only account for the Backstage ArgoCD plugin, which reads through the Backstage proxy.
    accounts.backstage: apiKey

    # Fields the cluster adds that cannot live in Git. Every other default is spelled out in the
    # manifests instead, so a deliberate change to it still shows as a diff.
    # - The API server adds conversion strategy None to CRDs that do not set one, and drops the
    #   empty labels and annotations maps the Kyverno chart renders on its CRDs.
    resource.customizations.ignoreDifferences.apiextensions.k8s.io_CustomResourceDefinition: |
      jqPathExpressions:
        - '.spec.conversion | select(. == {"strategy": "None"})'
        - '.metadata.labels | select(. == {})'
        - '.metadata.annotations | select(. == {})'
    # - Kyverno's webhook copies the deprecated spec-level validationFailureAction onto every
    #   ClusterPolicy. The policies use rule-level failureAction, and tests forbid the spec-level one.
    resource.customizations.ignoreDifferences.kyverno.io_ClusterPolicy: |
      jsonPointers:
        - /spec/validationFailureAction

    # ArgoCD stopped assessing child Application health in 1.8, which turns sync waves in an
    # App-of-Apps into creation order. This restores it, so each wave waits for the one before.
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil then
        if obj.status.health ~= nil then
          hs.status = obj.status.health.status
          if obj.status.health.message ~= nil then
            hs.message = obj.status.health.message
          end
        end
      end
      return hs

    # Programmed is the condition that means Envoy is serving the listeners.
    resource.customizations.health.gateway.networking.k8s.io_Gateway: |
      hs = {}
      hs.status = "Progressing"
      hs.message = "Waiting for the Gateway to be programmed"
      if obj.status ~= nil and obj.status.conditions ~= nil then
        for _, c in ipairs(obj.status.conditions) do
          if c.type == "Accepted" and c.status == "False" then
            hs.status = "Degraded"
            hs.message = c.message
            return hs
          end
          if c.type == "Programmed" then
            if c.status == "True" then
              hs.status = "Healthy"
              hs.message = c.message
            elseif c.reason ~= "Pending" then
              hs.status = "Degraded"
              hs.message = c.message
            end
          end
        end
      end
      return hs

    # A route whose parent does not exist, or whose backend does not resolve, serves nothing.
    resource.customizations.health.gateway.networking.k8s.io_HTTPRoute: |
      hs = {}
      hs.status = "Progressing"
      hs.message = "Waiting for a parent Gateway to accept the route"
      if obj.status ~= nil and obj.status.parents ~= nil and #obj.status.parents > 0 then
        for _, parent in ipairs(obj.status.parents) do
          if parent.conditions ~= nil then
            for _, c in ipairs(parent.conditions) do
              if (c.type == "Accepted" or c.type == "ResolvedRefs") and c.status == "False" then
                hs.status = "Degraded"
                hs.message = c.type .. ": " .. (c.message or c.reason or "")
                return hs
              end
            end
          end
        end
        hs.status = "Healthy"
        hs.message = "Accepted by every parent"
      end
      return hs

    resource.customizations.health.argoproj.io_EventBus: |
      hs = {}
      hs.status = "Progressing"
      hs.message = "Waiting for the EventBus to be deployed"
      if obj.status ~= nil and obj.status.conditions ~= nil then
        for _, c in ipairs(obj.status.conditions) do
          if c.status == "False" then
            hs.status = "Degraded"
            hs.message = c.type .. ": " .. (c.message or c.reason or "")
            return hs
          end
          if c.type == "Deployed" and c.status == "True" then
            hs.status = "Healthy"
            hs.message = "Deployed"
          end
        end
      end
      return hs

    resource.customizations.health.argoproj.io_EventSource: |
      hs = {}
      hs.status = "Progressing"
      hs.message = "Waiting for the EventSource to be deployed"
      if obj.status ~= nil and obj.status.conditions ~= nil then
        for _, c in ipairs(obj.status.conditions) do
          if c.status == "False" then
            hs.status = "Degraded"
            hs.message = c.type .. ": " .. (c.message or c.reason or "")
            return hs
          end
          if c.type == "Deployed" and c.status == "True" then
            hs.status = "Healthy"
            hs.message = "Deployed"
          end
        end
      end
      return hs

    resource.customizations.health.argoproj.io_Sensor: |
      hs = {}
      hs.status = "Progressing"
      hs.message = "Waiting for the Sensor to be deployed"
      if obj.status ~= nil and obj.status.conditions ~= nil then
        for _, c in ipairs(obj.status.conditions) do
          if c.status == "False" then
            hs.status = "Degraded"
            hs.message = c.type .. ": " .. (c.message or c.reason or "")
            return hs
          end
          if c.type == "Deployed" and c.status == "True" then
            hs.status = "Healthy"
            hs.message = "Deployed"
          end
        end
      end
      return hs

  rbac:
    # ArgoCD 3.x: logs need an explicit grant. The backstage account reads, nothing more.
    policy.csv: |
      p, role:readonly-with-logs, applications, get, */*, allow
      p, role:readonly-with-logs, logs, get, */*, allow
      p, role:readonly-with-logs, projects, get, *, allow
      p, role:readonly-with-logs, clusters, get, *, allow
      g, backstage, role:readonly-with-logs

# One person on a laptop signs in as admin. Dex and notifications add pods and nothing else here.
dex:
  enabled: false
notifications:
  enabled: false
