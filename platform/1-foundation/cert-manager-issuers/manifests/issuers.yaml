# ABOUTME: Self-signed bootstrap issuer, the root CA certificate it mints, and the CA ClusterIssuer that
# ABOUTME: signs every platform certificate. A ClusterIssuer reads its CA Secret from cert-manager's namespace.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-bootstrap
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: local-idp-root-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: local-idp-root-ca
  secretName: local-idp-root-ca
  duration: 87600h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: selfsigned-bootstrap
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: local-idp-ca
spec:
  ca:
    secretName: local-idp-root-ca
