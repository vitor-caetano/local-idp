# ABOUTME: Wave 2. The local CA: a self-signed issuer mints the root, and the local-idp-ca ClusterIssuer
# ABOUTME: signs with it. trust-ca.sh exports the root from the local-idp-root-ca Secret.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-issuers
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: http://gitea-http.gitea.svc:3000/platform/local-idp.git
    targetRevision: main
    path: platform/1-foundation/cert-manager-issuers/manifests
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
