# ABOUTME: Wave 1. The in-cluster Git host. seed-gitea.sh applies this file directly, before ArgoCD
# ABOUTME: has a Git source, then ArgoCD adopts it from the seeded tree. Its chart comes from dl.gitea.com.
#
# The admin account below is a local dev value. seed-gitea.sh reads it from this file into the
# gitea-seed-creds Secret, which every other consumer reads, so there is one copy (defect class 5).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitea
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://dl.gitea.com/charts/
    chart: gitea
    targetRevision: 12.6.0
    helm:
      releaseName: gitea
      valuesObject:
        gitea:
          admin:
            username: gitea-admin
            password: "local-dev-only"
            email: "gitea-admin@localtest.me"
            passwordMode: keepUpdated
          config:
            # Gitea builds every clone URL and webhook payload URL from ROOT_URL, and the consumers
            # of those (ArgoCD, the CI pipeline, the ApplicationSet SCM generator) are in-cluster.
            # gitea.localtest.me resolves to 127.0.0.1 inside a pod, so it cannot be the root.
            # The browser still reaches the UI at https://gitea.localtest.me through the Gateway.
            server:
              DOMAIN: gitea-http.gitea.svc
              ROOT_URL: http://gitea-http.gitea.svc:3000/
            database:
              DB_TYPE: sqlite3
            # No Valkey: one replica keeps sessions, cache and queues in process.
            session:
              PROVIDER: memory
            cache:
              ADAPTER: memory
            queue:
              TYPE: level
            # Webhooks to private addresses are refused by default, and the CI EventSource is a
            # ClusterIP. Without this, delivery fails and nothing reports it.
            webhook:
              ALLOWED_HOST_LIST: private
            service:
              DISABLE_REGISTRATION: true
        # SQLite on one RWO volume: never run two pods at once.
        strategy:
          type: Recreate
          rollingUpdate: null
        persistence:
          enabled: true
          size: 5Gi
          storageClass: standard
        postgresql:
          enabled: false
        postgresql-ha:
          enabled: false
        valkey:
          enabled: false
        valkey-cluster:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: gitea
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
