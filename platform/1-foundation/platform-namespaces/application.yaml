# ABOUTME: Wave 0. Every platform namespace, created before any component that installs into one.
# ABOUTME: apps carries the label that opts it into Kyverno policy; no other namespace does.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-namespaces
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: http://gitea-http.gitea.svc:3000/platform/local-idp.git
    targetRevision: main
    path: platform/1-foundation/platform-namespaces/manifests
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
