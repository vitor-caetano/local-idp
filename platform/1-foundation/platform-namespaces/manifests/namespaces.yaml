# ABOUTME: One namespace per logical area. Prune=false keeps a namespace, and everything in it,
# ABOUTME: when its entry is removed here; deleting one is a deliberate act, not a side effect.
apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
---
apiVersion: v1
kind: Namespace
metadata:
  name: envoy-gateway-system
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
---
apiVersion: v1
kind: Namespace
metadata:
  name: platform-gateway
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
---
apiVersion: v1
kind: Namespace
metadata:
  name: openbao
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
---
apiVersion: v1
kind: Namespace
metadata:
  name: external-secrets
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
---
apiVersion: v1
kind: Namespace
metadata:
  name: kyverno
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
---
apiVersion: v1
kind: Namespace
metadata:
  name: observability
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
---
apiVersion: v1
kind: Namespace
metadata:
  name: argo
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
---
apiVersion: v1
kind: Namespace
metadata:
  name: argo-events
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
---
apiVersion: v1
kind: Namespace
metadata:
  name: argo-rollouts
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
---
apiVersion: v1
kind: Namespace
metadata:
  name: keda
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
---
apiVersion: v1
kind: Namespace
metadata:
  name: backstage
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
---
apiVersion: v1
kind: Namespace
metadata:
  name: ci
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
  labels:
    # Rootless BuildKit needs seccomp and AppArmor Unconfined, which only a privileged namespace allows.
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: v1
kind: Namespace
metadata:
  name: apps
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
  labels:
    # Kyverno rules select this label. apps is the only namespace that carries it.
    local-idp.dev/policy: enforce
