# ABOUTME: Wave 3. Loki as one binary on filesystem storage, no caches, no canary. Alloy ships to it
# ABOUTME: through loki-gateway, which Grafana and the phase 3 test also read from.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://grafana-community.github.io/helm-charts
    chart: loki
    targetRevision: 17.4.7
    helm:
      releaseName: loki
      valuesObject:
        deploymentMode: Monolithic
        loki:
          # One tenant on a laptop. Without this every client must send an X-Scope-OrgID header.
          auth_enabled: false
          commonConfig:
            replication_factor: 1
          storage:
            type: filesystem
          schemaConfig:
            configs:
              - from: "2026-01-01"
                store: tsdb
                object_store: filesystem
                schema: v13
                index:
                  prefix: index_
                  period: 24h
          limits_config:
            retention_period: 72h
        singleBinary:
          replicas: 1
          persistence:
            size: 5Gi
            storageClass: standard
        # The simple scalable targets default to three replicas each; zero them for one binary.
        read:
          replicas: 0
        write:
          replicas: 0
        backend:
          replicas: 0
        chunksCache:
          enabled: false
        resultsCache:
          enabled: false
        lokiCanary:
          enabled: false
        test:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
