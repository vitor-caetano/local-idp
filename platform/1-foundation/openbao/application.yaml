# ABOUTME: Wave 3. OpenBao in dev mode: in memory, unsealed, a fixed root token. A restart empties it;
# ABOUTME: provision/resume-cluster.sh refills it. Local experiments only, never production.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openbao
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://openbao.github.io/openbao-helm
    chart: openbao
    targetRevision: 0.28.4
    helm:
      releaseName: openbao
      valuesObject:
        server:
          dev:
            enabled: true
            # A documented local dev value, and the only copy. The Secret below is templated from it, and
            # External Secrets, the seed Job and resume-cluster.sh all read that Secret.
            devRootToken: "local-dev-only"
        injector:
          enabled: false
        extraObjects:
          - apiVersion: v1
            kind: Secret
            metadata:
              name: openbao-root-token
            stringData:
              token: '{{ .Values.server.dev.devRootToken }}'
  destination:
    server: https://kubernetes.default.svc
    namespace: openbao
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
