# ABOUTME: Wave 4. The OpenTelemetry Collector as a Deployment: OTLP in over gRPC and HTTP, traces out to
# ABOUTME: Tempo. Services send to opentelemetry-collector.observability.svc, never to Tempo directly.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opentelemetry-collector
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  source:
    repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
    chart: opentelemetry-collector
    targetRevision: 0.158.2
    helm:
      releaseName: opentelemetry-collector
      valuesObject:
        mode: deployment
        image:
          repository: otel/opentelemetry-collector-contrib
        command:
          name: otelcol-contrib
        config:
          receivers:
            jaeger: null
            zipkin: null
            prometheus: null
          exporters:
            otlp/tempo:
              endpoint: tempo.observability.svc:4317
              tls:
                insecure: true
          service:
            pipelines:
              logs: null
              metrics:
                receivers: [otlp]
                processors: [memory_limiter, batch]
                exporters: [debug]
              traces:
                receivers: [otlp]
                processors: [memory_limiter, batch]
                exporters: [otlp/tempo]
        ports:
          jaeger-compact:
            enabled: false
          jaeger-thrift:
            enabled: false
          jaeger-grpc:
            enabled: false
          zipkin:
            enabled: false
        resources:
          limits:
            memory: 256Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
