# ABOUTME: Wave 3. The Argo Events controller and CRDs only. The chart installs no EventBus; the golden
# ABOUTME: path declares a JetStream one beside its EventSource and Sensor in phase 6.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-events
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-events
    targetRevision: 2.4.22
    helm:
      releaseName: argo-events
      valuesObject:
        crds:
          install: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-events
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
