# ABOUTME: Wave 2. The one Gateway every UI sits behind: Envoy's data plane as a NodePort on 30080/30443,
# ABOUTME: which Kind maps to host 80/443, an HTTP listener that only redirects, and the wildcard cert.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: http://gitea-http.gitea.svc:3000/platform/local-idp.git
    targetRevision: main
    path: platform/1-foundation/platform-gateway/manifests
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
