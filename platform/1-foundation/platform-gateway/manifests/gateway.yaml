# ABOUTME: GatewayClass, the EnvoyProxy that pins the data plane to fixed NodePorts, the Gateway, its
# ABOUTME: wildcard certificate, and the HTTP-to-HTTPS redirect. API defaults are spelled out so it stays Synced.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: nodeport-proxy
  namespace: platform-gateway
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: NodePort
        # Envoy Gateway defaults to Local. Kind maps host ports onto the control plane, and Envoy runs
        # on a worker, so Local drops every packet that arrives through the mapping.
        externalTrafficPolicy: Cluster
        patch:
          type: StrategicMerge
          value:
            spec:
              ports:
                - port: 80
                  protocol: TCP
                  nodePort: 30080
                - port: 443
                  protocol: TCP
                  nodePort: 30443
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy-gateway
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: nodeport-proxy
    namespace: platform-gateway
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-localtest-me
  namespace: platform-gateway
spec:
  secretName: wildcard-localtest-me
  dnsNames:
    - "*.localtest.me"
    - localtest.me
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: local-idp-ca
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: platform-gateway
  namespace: platform-gateway
spec:
  gatewayClassName: envoy-gateway
  listeners:
    # Only the redirect route below attaches here.
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    # Routes from any namespace attach here, each with its own hostname.
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.localtest.me"
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: wildcard-localtest-me
      allowedRoutes:
        namespaces:
          from: All
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-to-https-redirect
  namespace: platform-gateway
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: platform-gateway
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
