# ABOUTME: The gitea-config Job's identity: it reads the seed credentials in gitea and writes the token
# ABOUTME: Secrets in argocd, ci and backstage. Nothing else, and no cluster-wide grant.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitea-config
  namespace: gitea
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gitea-config-read-seed
  namespace: gitea
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["gitea-seed-creds"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitea-config-read-seed
  namespace: gitea
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gitea-config-read-seed
subjects:
  - kind: ServiceAccount
    name: gitea-config
    namespace: gitea
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gitea-config-write-secrets
  namespace: argocd
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitea-config-write-secrets
  namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gitea-config-write-secrets
subjects:
  - kind: ServiceAccount
    name: gitea-config
    namespace: gitea
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gitea-config-write-secrets
  namespace: ci
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitea-config-write-secrets
  namespace: ci
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gitea-config-write-secrets
subjects:
  - kind: ServiceAccount
    name: gitea-config
    namespace: gitea
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gitea-config-write-secrets
  namespace: backstage
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitea-config-write-secrets
  namespace: backstage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gitea-config-write-secrets
subjects:
  - kind: ServiceAccount
    name: gitea-config
    namespace: gitea
