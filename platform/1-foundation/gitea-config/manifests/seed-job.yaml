# ABOUTME: Creates the services org, mints the automation token, writes it where each consumer reads
# ABOUTME: it, and registers the org push webhook. Every step is idempotent, so a rerun is safe.
#
# The admin account comes from gitea-seed-creds, which seed-gitea.sh derives from the gitea chart
# values, so there is one copy of it (defect class 5). The token is reissued on every run.
apiVersion: batch/v1
kind: Job
metadata:
  name: gitea-config
  namespace: gitea
spec:
  backoffLimit: 10
  template:
    spec:
      serviceAccountName: gitea-config
      restartPolicy: OnFailure
      securityContext:
        # alpine/k8s has no non-root user; nobody needs nothing but /tmp.
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: configure
          image: alpine/k8s:1.36.4
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: HOME
              value: /tmp
            - name: GITEA
              value: http://gitea-http.gitea.svc:3000
            - name: WEBHOOK_URL
              value: http://gitea-eventsource-svc.argo-events.svc:12000/push
            - name: GITEA_USER
              valueFrom:
                secretKeyRef:
                  name: gitea-seed-creds
                  key: username
            - name: GITEA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gitea-seed-creds
                  key: password
          command: ["/bin/sh", "-ec"]
          args:
            - |
              api() { curl -fsS -u "${GITEA_USER}:${GITEA_PASSWORD}" -H 'Content-Type: application/json' "$@"; }

              until curl -fsS "${GITEA}/api/v1/version" >/dev/null; do echo "waiting for Gitea"; sleep 3; done

              # 1. The services org, where every golden-path repo lives.
              if api "${GITEA}/api/v1/orgs/services" >/dev/null 2>&1; then
                echo "org services exists"
              else
                api -X POST "${GITEA}/api/v1/orgs" \
                  -d '{"username":"services","visibility":"public"}' >/dev/null
                echo "created org services"
              fi

              # 2. A fresh automation token. Gitea shows a token's value only once, so reissue it.
              api -X DELETE "${GITEA}/api/v1/users/${GITEA_USER}/tokens/platform-automation" >/dev/null 2>&1 || true
              token="$(api -X POST "${GITEA}/api/v1/users/${GITEA_USER}/tokens" \
                -d '{"name":"platform-automation","scopes":["all"]}' | jq -r .sha1)"
              [ -n "${token}" ] && [ "${token}" != "null" ] || { echo "no token returned"; exit 1; }

              # 3. Hand it out. The ApplicationSet SCM generator, the CI pipeline and Backstage.
              put_secret() {
                ns="$1"; name="$2"; shift 2
                kubectl create secret generic "${name}" -n "${ns}" "$@" --dry-run=client -o yaml \
                  | kubectl apply -f - >/dev/null
                echo "wrote ${ns}/${name}"
              }
              put_secret argocd gitea-scm-token --from-literal=token="${token}"
              put_secret ci gitea-ci-credentials \
                --from-literal=username="${GITEA_USER}" --from-literal=token="${token}"
              put_secret backstage gitea-credentials \
                --from-literal=username="${GITEA_USER}" --from-literal=token="${token}"

              # 4. The org push webhook to the Argo Events EventSource.
              if api "${GITEA}/api/v1/orgs/services/hooks" | jq -e --arg u "${WEBHOOK_URL}" \
                  'any(.[]; .config.url == $u)' >/dev/null; then
                echo "webhook exists"
              else
                api -X POST "${GITEA}/api/v1/orgs/services/hooks" -d "$(jq -n --arg u "${WEBHOOK_URL}" \
                  '{type:"gitea",active:true,events:["push"],config:{url:$u,content_type:"json"}}')" >/dev/null
                echo "created webhook ${WEBHOOK_URL}"
              fi
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
