# ABOUTME: The Backstage Postgres credentials, generated in OpenBao by the openbao-seed Job. Postgres
# ABOUTME: and Backstage both read this one Secret, so there is no second copy to drift.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backstage-postgres
  namespace: backstage
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: backstage-postgres
  data:
    - secretKey: POSTGRES_USER
      remoteRef:
        key: backstage-postgres
        property: username
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: backstage-postgres
        property: password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
