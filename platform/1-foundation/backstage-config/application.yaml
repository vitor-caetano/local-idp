# ABOUTME: Wave 4. What Backstage needs before it starts: Postgres with its password from OpenBao, and the
# ABOUTME: the Kubernetes plugin's service account, and the read-only ArgoCD token for the ArgoCD plugin.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backstage-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  source:
    repoURL: http://gitea-http.gitea.svc:3000/platform/local-idp.git
    targetRevision: main
    path: platform/1-foundation/backstage-config/manifests
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
