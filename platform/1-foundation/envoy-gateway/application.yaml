# ABOUTME: Wave 1. The Envoy Gateway controller and the Gateway API CRDs it supports. The Gateway, its
# ABOUTME: NodePort data plane and the redirect route come in wave 2, from platform-gateway.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    # An OCI chart. The repository is declared with enableOCI in argocd-values.yaml.
    repoURL: docker.io/envoyproxy
    chart: gateway-helm
    targetRevision: 1.9.2
    helm:
      releaseName: envoy-gateway
      valuesObject:
        crds:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-gateway-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
