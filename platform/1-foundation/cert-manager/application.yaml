# ABOUTME: Wave 1. cert-manager with its CRDs. The issuers and the wildcard certificate come in wave 2,
# ABOUTME: from cert-manager-issuers and platform-gateway, once these CRDs exist.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: v1.20.2
    helm:
      releaseName: cert-manager
      valuesObject:
        crds:
          enabled: true
          # Deleting the CRDs deletes every Certificate in the cluster with them.
          keep: true
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
