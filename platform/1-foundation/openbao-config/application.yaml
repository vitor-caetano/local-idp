# ABOUTME: Wave 4. The openbao ClusterSecretStore, the Job that seeds OpenBao, and a demo ExternalSecret
# ABOUTME: that proves the path from OpenBao to a Kubernetes Secret end to end.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openbao-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  source:
    repoURL: REPLACE_WITH_PLATFORM_REPO_URL
    targetRevision: main
    path: platform/1-foundation/openbao-config/manifests
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
