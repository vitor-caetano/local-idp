# ABOUTME: The demo ExternalSecret: secret/demo in OpenBao becomes Secret demo-app-credentials here.
# ABOUTME: Phase 2's test reads the username back to prove the whole path works.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: demo-app-credentials
  namespace: openbao
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: demo-app-credentials
  data:
    - secretKey: username
      remoteRef:
        key: demo
        property: username
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: password
      remoteRef:
        key: demo
        property: password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
