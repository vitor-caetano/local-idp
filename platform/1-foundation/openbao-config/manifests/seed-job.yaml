# ABOUTME: Seeds OpenBao: writes secret/demo and generates secret/backstage-postgres if it is absent.
# ABOUTME: Never overwrites the Postgres password, which Postgres keeps from its first start.
#
# OpenBao runs in memory, so a restart empties it. provision/resume-cluster.sh puts the Postgres
# credentials back from the surviving Secret, then deletes this Job so ArgoCD reruns it for the rest.
apiVersion: batch/v1
kind: Job
metadata:
  name: openbao-seed
  namespace: openbao
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        # The openbao user in quay.io/openbao/openbao (checked with id).
        runAsUser: 100
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seed
          image: quay.io/openbao/openbao:2.5.5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: BAO_ADDR
              value: http://openbao.openbao.svc:8200
            - name: BAO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openbao-root-token
                  key: token
          command: ["/bin/sh", "-ec"]
          args:
            - |
              until bao status >/dev/null 2>&1; do echo "waiting for OpenBao"; sleep 3; done

              bao kv put secret/demo username=local-idp password=demo-only >/dev/null
              echo "wrote secret/demo"

              if bao kv get secret/backstage-postgres >/dev/null 2>&1; then
                echo "secret/backstage-postgres exists, leaving it alone"
              else
                password="$(head -c 32 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 24)"
                bao kv put secret/backstage-postgres username=backstage password="${password}" >/dev/null
                echo "generated secret/backstage-postgres"
              fi
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
