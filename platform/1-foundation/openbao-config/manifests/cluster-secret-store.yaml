# ABOUTME: The one secret store the platform reads from: OpenBao's KV v2 engine at secret/, through the
# ABOUTME: vault provider, authenticated by the root token Secret the openbao chart templates.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  provider:
    vault:
      server: http://openbao.openbao.svc:8200
      path: secret
      version: v2
      auth:
        tokenSecretRef:
          name: openbao-root-token
          namespace: openbao
          key: token
