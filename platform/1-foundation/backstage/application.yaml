# ABOUTME: Wave 5. Backstage from the platform image in the local registry. Every host and secret arrives as an
# ABOUTME: env var; the image's app-config.production.yaml reads them. Bump the tag with build-and-push.sh.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backstage
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: default
  source:
    repoURL: https://backstage.github.io/charts
    chart: backstage
    targetRevision: 2.8.2
    helm:
      releaseName: backstage
      valuesObject:
        backstage:
          image:
            registry: localhost:5001
            repository: local-idp/backstage
            # Must match TAG in images/backstage/build-and-push.sh.
            tag: 0.1.2
            pullPolicy: IfNotPresent
          # The image's CMD, spelled out: the chart's empty args would otherwise be the only signal.
          args: ["--config", "app-config.production.yaml"]
          podSecurityContext:
            runAsNonRoot: true
            # The node user in the image (checked with id).
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
          extraEnvVars:
            - name: BACKSTAGE_BASE_URL
              value: https://backstage.localtest.me
            # Where the catalog reads the golden-path template and the org file. set-git-source.sh
            # rewrites this together with every repoURL.
            - name: PLATFORM_RAW_BASE
              value: "http://gitea-http.gitea.svc:3000/platform/local-idp/raw/branch/main"
            - name: POSTGRES_HOST
              value: backstage-postgres.backstage.svc
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: backstage-postgres
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backstage-postgres
                  key: POSTGRES_PASSWORD
            - name: GITEA_HOST
              value: gitea-http.gitea.svc:3000
            # The automation token works as a basic-auth password, so Backstage never holds the admin one.
            - name: GITEA_USERNAME
              valueFrom:
                secretKeyRef:
                  name: gitea-credentials
                  key: username
            - name: GITEA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gitea-credentials
                  key: token
            - name: ARGOCD_URL
              value: http://argo-cd-argocd-server.argocd.svc
            # Minted by the argocd-token Job in backstage-config for the read-only backstage account.
            - name: ARGOCD_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: argocd-credentials
                  key: token
            - name: K8S_SA_TOKEN
              valueFrom:
                secretKeyRef:
                  name: backstage-sa-token
                  key: token
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1536Mi
        serviceAccount:
          create: false
          name: backstage
        postgresql:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: backstage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
