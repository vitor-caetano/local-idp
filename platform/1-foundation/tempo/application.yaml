# ABOUTME: Wave 3. Tempo as one binary with OTLP receivers. No persistence: a restart empties it, which is
# ABOUTME: why the phase 3 test sends the span it looks for. Held at 1.25.0, see components.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tempo
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://grafana-community.github.io/helm-charts
    chart: tempo
    targetRevision: 1.25.0
    helm:
      releaseName: tempo
      valuesObject:
        tempo:
          reportingEnabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
