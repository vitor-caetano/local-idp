# ABOUTME: Wave 6. The foundation policy baseline: four ClusterPolicies, every rule Audit, permanently.
# ABOUTME: Each selects only namespaces labelled local-idp.dev/policy=enforce, which today means apps.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: policy-baseline
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  project: default
  source:
    repoURL: REPLACE_WITH_PLATFORM_REPO_URL
    targetRevision: main
    path: platform/1-foundation/policy-baseline/manifests
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
