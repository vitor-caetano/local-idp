# ABOUTME: Wave 3. Prometheus, Grafana, kube-state-metrics and node-exporter. Prometheus selects every
# ABOUTME: ServiceMonitor in the cluster; Grafana carries Loki and Tempo as datasources beside Prometheus.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 86.3.2
    helm:
      releaseName: kube-prometheus-stack
      valuesObject:
        # Kind binds etcd, the scheduler, the controller manager and kube-proxy metrics to loopback, so
        # those targets could never be scraped. Disabled rather than left permanently down.
        kubeEtcd:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeControllerManager:
          enabled: false
        kubeProxy:
          enabled: false
        alertmanager:
          enabled: false
        prometheus:
          prometheusSpec:
            retention: 2d
            # Select every ServiceMonitor, PodMonitor, rule and probe, not only the ones carrying this
            # release's label, so a component's monitor is picked up without knowing the release name.
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            probeSelectorNilUsesHelmValues: false
            scrapeConfigSelectorNilUsesHelmValues: false
        grafana:
          # A documented local dev value.
          adminPassword: local-dev-only
          grafana.ini:
            server:
              root_url: https://grafana.localtest.me
          additionalDataSources:
            - name: Loki
              type: loki
              uid: loki
              access: proxy
              url: http://loki-gateway.observability.svc
            - name: Tempo
              type: tempo
              uid: tempo
              access: proxy
              url: http://tempo.observability.svc:3200
              jsonData:
                tracesToLogsV2:
                  datasourceUid: loki
                serviceMap:
                  datasourceUid: prometheus
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
