# ABOUTME: Wave 3. Argo Workflows, the CI engine. Workflows run in ci as the ci-runner service account the
# ABOUTME: chart creates there. The server runs in server auth mode, right for one person on a laptop.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-workflows
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-workflows
    targetRevision: 1.0.16
    helm:
      releaseName: argo-workflows
      valuesObject:
        # The full CRDs are too big for a plain apply, so the chart installs them from a hook Job that
        # downloads them from GitHub at sync time. The minified CRDs are ordinary resources ArgoCD
        # applies and tracks like any other.
        crds:
          install: true
          full: false
        controller:
          # The chart creates the workflow service account and its Role in each of these namespaces.
          workflowNamespaces:
            - ci
        workflow:
          serviceAccount:
            create: true
            name: ci-runner
          rbac:
            create: true
        server:
          # No login: the UI and API act as the server's own service account.
          authModes:
            - server
  destination:
    server: https://kubernetes.default.svc
    namespace: argo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
