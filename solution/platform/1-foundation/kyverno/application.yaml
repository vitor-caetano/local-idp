# ABOUTME: Kyverno, the admission policy engine. Installed in wave 1; its policies arrive last
# ABOUTME: (policy-baseline, wave 6) and all ship in Audit. Install first, enforce last.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://kyverno.github.io/kyverno
    # Chart version, not the app version. Chart 3.8.1 ships Kyverno v1.18.1.
    chart: kyverno
    targetRevision: 3.8.1
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
