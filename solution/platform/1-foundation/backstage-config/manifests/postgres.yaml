# ABOUTME: A single PostgreSQL for Backstage's catalog, so registered components survive a restart.
# ABOUTME: Credentials come from OpenBao through an ExternalSecret; nothing about them is in Git.
#
# A plain StatefulSet rather than a chart: the Bitnami PostgreSQL chart the Backstage chart bundles
# moved its images behind a paid tier, and one Postgres pod needs nothing a chart adds.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backstage-postgres
  namespace: backstage
  labels:
    app.kubernetes.io/part-of: local-idp
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: backstage-postgres
    creationPolicy: Owner
  data:
    # Named the way both the postgres image and Backstage's app-config read them, so one Secret
    # serves both (defect class 5).
    - secretKey: POSTGRES_USER
      remoteRef:
        key: backstage-postgres
        property: username
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: backstage-postgres
        property: password
---
apiVersion: v1
kind: Service
metadata:
  name: backstage-postgres
  namespace: backstage
  labels:
    app: backstage-postgres
spec:
  selector:
    app: backstage-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: backstage-postgres
  namespace: backstage
  labels:
    app: backstage-postgres
spec:
  serviceName: backstage-postgres
  replicas: 1
  selector:
    matchLabels:
      app: backstage-postgres
  template:
    metadata:
      labels:
        app: backstage-postgres
        version: "17.6"
    spec:
      securityContext:
        # The postgres image's postgres user is uid/gid 999. Running as it directly skips the
        # entrypoint's root-then-gosu step; fsGroup makes the volume writable (defect class 2).
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:17.6
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: backstage-postgres
          env:
            # A subdirectory, because the volume root holds lost+found and initdb refuses a
            # non-empty directory.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -h 127.0.0.1"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -h 127.0.0.1"]
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
      volumes:
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
