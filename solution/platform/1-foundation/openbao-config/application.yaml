# ABOUTME: Wires External Secrets to OpenBao: the ClusterSecretStore, the dev token, a seed Job,
# ABOUTME: and a demo ExternalSecret. Syncs after both are up (wave 2).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openbao-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: REPLACE_WITH_PLATFORM_REPO_URL
    targetRevision: main
    path: platform/1-foundation/openbao-config/manifests
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: openbao
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
