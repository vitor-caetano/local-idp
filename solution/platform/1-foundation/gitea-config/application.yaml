# ABOUTME: Seeds Gitea for self-service: the services org, one automation token handed to the three
# ABOUTME: consumers that need it, the org webhook that starts CI, and Backstage's integration Secret.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitea-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: REPLACE_WITH_PLATFORM_REPO_URL
    targetRevision: main
    path: platform/1-foundation/gitea-config/manifests
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: gitea
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
