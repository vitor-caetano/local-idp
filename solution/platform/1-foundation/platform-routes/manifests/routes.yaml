# ABOUTME: One HTTPRoute per platform UI, each in its backend's namespace so no ReferenceGrant is
# ABOUTME: needed. Service names follow each chart's release naming; check them when a chart moves.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  parentRefs:
    - name: platform-gateway
      namespace: platform-gateway
      sectionName: https
  hostnames: ["argocd.localtest.me"]
  rules:
    - backendRefs:
        - name: argo-cd-argocd-server
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gitea
  namespace: gitea
spec:
  parentRefs:
    - name: platform-gateway
      namespace: platform-gateway
      sectionName: https
  hostnames: ["gitea.localtest.me"]
  rules:
    - backendRefs:
        - name: gitea-http
          port: 3000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: observability
spec:
  parentRefs:
    - name: platform-gateway
      namespace: platform-gateway
      sectionName: https
  hostnames: ["grafana.localtest.me"]
  rules:
    - backendRefs:
        - name: kube-prometheus-stack-grafana
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argo-workflows
  namespace: argo
spec:
  parentRefs:
    - name: platform-gateway
      namespace: platform-gateway
      sectionName: https
  hostnames: ["workflows.localtest.me"]
  rules:
    - backendRefs:
        - name: argo-workflows-server
          port: 2746
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: backstage
  namespace: backstage
spec:
  parentRefs:
    - name: platform-gateway
      namespace: platform-gateway
      sectionName: https
  hostnames: ["backstage.localtest.me"]
  rules:
    - backendRefs:
        - name: backstage
          port: 7007
