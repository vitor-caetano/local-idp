# ABOUTME: GatewayClass, EnvoyProxy, the platform Gateway, its wildcard certificate, and the
# ABOUTME: HTTP to HTTPS redirect. Every UI and every golden-path service attaches to this Gateway.
---
# Kind has no load balancer, so a LoadBalancer Service would sit Pending forever. NodePort with
# fixed ports lines up with extraPortMappings in provision/kind-config.yaml: host 80 -> 30080,
# host 443 -> 30443. Envoy Gateway names Service ports after the listener ports, and the Service
# port list merges on `port`, so the patch pins the NodePort of the 80 and 443 entries.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: kind-nodeport
  namespace: envoy-gateway-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: NodePort
        patch:
          type: StrategicMerge
          value:
            spec:
              ports:
                - port: 80
                  nodePort: 30080
                - port: 443
                  nodePort: 30443
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: kind-nodeport
    namespace: envoy-gateway-system
---
# One certificate for every *.localtest.me host, signed by the local CA.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-localtest-me
  namespace: platform-gateway
spec:
  secretName: wildcard-localtest-me
  dnsNames:
    - "*.localtest.me"
  duration: 2160h
  issuerRef:
    name: local-idp-ca
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: platform-gateway
  namespace: platform-gateway
spec:
  gatewayClassName: envoy
  listeners:
    # Plain HTTP exists only to redirect. Same-namespace routes only, so nothing else can serve on it.
    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.localtest.me"
      allowedRoutes:
        namespaces:
          from: Same
    # Routes from any namespace may attach. On a shared cluster this would be a Selector on a
    # namespace label; on a single-person laptop cluster All keeps the golden path simple.
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.localtest.me"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: wildcard-localtest-me
      allowedRoutes:
        namespaces:
          from: All
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: redirect-to-https
  namespace: platform-gateway
spec:
  parentRefs:
    - name: platform-gateway
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
