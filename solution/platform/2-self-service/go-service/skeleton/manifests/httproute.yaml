apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ${{ values.name }}
  labels:
    backstage.io/kubernetes-id: ${{ values.name }}
spec:
  # group, kind, weight and the PathPrefix match are the API server's defaults, spelled out so the
  # svc-<name> Application does not read OutOfSync forever. The canary scales replicas and never
  # edits this route, so pinning weight: 1 does not fight Argo Rollouts.
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: platform-gateway
      namespace: platform-gateway
      sectionName: https
  hostnames:
    - ${{ values.name }}.localtest.me
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: ${{ values.name }}
          port: 80
          weight: 1
