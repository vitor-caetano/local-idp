apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ${{ values.name }}
  labels:
    backstage.io/kubernetes-id: ${{ values.name }}
spec:
  parentRefs:
    - name: platform-gateway
      namespace: platform-gateway
      sectionName: https
  hostnames:
    - ${{ values.name }}.localtest.me
  rules:
    - backendRefs:
        - name: ${{ values.name }}
          port: 80
