# ABOUTME: The Kind cluster: one control plane that takes host ports 80 and 443, and two workers.
# ABOUTME: Node image pinned by digest; containerd reads per-registry config from certs.d.
#
# Host 80 and 443 map to NodePorts 30080 and 30443. The Envoy Gateway data plane Service is pinned
# to those NodePorts (see 1-foundation/platform-gateway), so https://<name>.localtest.me on your Mac
# reaches the Gateway without a cloud load balancer. listenAddress keeps them on loopback.
#
# config_path points containerd at /etc/containerd/certs.d, where create-cluster.sh writes the
# hosts.toml that maps localhost:5001 onto the kind-registry container.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: local-idp
nodes:
  - role: control-plane
    image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 30080
        hostPort: 80
        listenAddress: "127.0.0.1"
        protocol: TCP
      - containerPort: 30443
        hostPort: 443
        listenAddress: "127.0.0.1"
        protocol: TCP
  - role: worker
    image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
  - role: worker
    image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"
